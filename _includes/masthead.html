<!-- Scroll progress, rendered only where a long read needs it. -->
{% if page.layout == 'post' %}
<div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
{% endif %}

<header class="masthead">
  <div class="masthead__inner">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="masthead__nav" aria-label="Primary">
      <ul>
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a></li>
        <!-- A static file, so it can never be the current page. -->
        <li><a href="{{ site.cv_pdf | relative_url }}">CV</a></li>
      </ul>
    </nav>
  </div>
</header>

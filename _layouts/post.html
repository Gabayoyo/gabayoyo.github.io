---
layout: default
---
<article class="post" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="post__head">
    <h1 class="post__title" itemprop="headline">{{ page.title }}</h1>
    {% if page.description %}<p class="post__lead">{{ page.description }}</p>{% endif %}

    <div class="post__meta">
      <span itemprop="author">{{ site.author.name }}</span>
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%-d %B %Y" }}</time>
    </div>
  </header>

  <div class="post__content" itemprop="articleBody">
    {{ content }}
  </div>
</article>

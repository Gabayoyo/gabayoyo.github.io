---
layout: default
---
<article class="page">
  <div class="page__inner">
    {% if page.title and page.show_title != false %}
      <header class="page__head">
        <h1 class="page__title">{{ page.title }}</h1>
        {% if page.lede %}<p class="page__summary">{{ page.lede }}</p>{% endif %}
      </header>
    {% endif %}

    <div class="page__content">
      {{ content }}
    </div>
  </div>
</article>
